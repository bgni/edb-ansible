---
- name: Select synchronous standby application names
  ansible.builtin.set_fact:
    _synchronous_standby_applications: >-
      {{
        synchronous_standby_application_names
        if synchronous_standby_application_names | length > 0
        else _synchronous_standbys | default([])
      }}

- name: Validate structured synchronous standby policy
  ansible.builtin.assert:
    that:
      - standby_quorum_type | upper in ['ANY', 'FIRST']
      - synchronous_standby_num_sync | int >= 1
      - synchronous_standby_num_sync | int <= _synchronous_standby_applications | length
      - _synchronous_standby_applications | unique | list | length == _synchronous_standby_applications | length
      - _synchronous_standby_applications | select | list | length == _synchronous_standby_applications | length
    fail_msg: >-
      Invalid synchronous standby policy: quorum={{ standby_quorum_type }},
      num_sync={{ synchronous_standby_num_sync }},
      application_names={{ _synchronous_standby_applications }}
  when:
    - synchronous_standby_names|length < 1

- name: Build effective synchronous_standby_names
  ansible.builtin.set_fact:
    _effective_synchronous_standby_names: >-
      {% if synchronous_standby_names | length > 0 %}
      {{ synchronous_standby_names }}
      {% else %}
      {{ standby_quorum_type | upper }} {{ synchronous_standby_num_sync | int }} ({{ _synchronous_standby_applications | map('to_json') | join(',') }})
      {% endif %}

- name: Configure synchronous policy on every promotion candidate
  ansible.builtin.include_tasks: configure_synchronous_node.yml
  loop: "{{ pg_cluster_nodes }}"
  loop_control:
    loop_var: synchronous_node
  when: synchronous_node.node_type in ['primary', 'standby']
