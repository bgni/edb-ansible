version: '3'

services:
  ansible-tester:
    build:
      context: ../../docker
      dockerfile: Dockerfile.ansible-tester
      args:
        ansible_core_version: "${ANSIBLE_CORE_VERSION}"
    environment:
    - EDB_REPO_USERNAME="${EDB_REPO_USERNAME:- }"
    - EDB_REPO_PASSWORD="${EDB_REPO_PASSWORD:- }"
    - EDB_REPO_TOKEN="${EDB_REPO_TOKEN:- }"
    - EDB_ENABLE_REPO=${EDB_ENABLE_REPO:-true}
    - EDB_PG_TYPE
    - EDB_PG_VERSION
    - CASE_NAME=setup_quorum_replication
    - EDB_OS
    - ANSIBLE_CORE_VERSION="${ANSIBLE_CORE_VERSION:-2.13}"
    volumes:
    - ../../..:/workspace
    command: "/workspace/tests/docker/exec-tests.sh"
  primary1-rhel9:
    privileged: true
    build:
      context: ../../docker
      dockerfile: Dockerfile.rhel9
      args:
        rhel9_image_tag: "${RHEL9_IMAGE_TAG:-9.7}"
    cap_add:
    - SYS_ADMIN
    # systemd needs a writable cgroup tree rooted at the host hierarchy. The
    # older `- /sys/fs/cgroup:ro` form used by the other test cases only works
    # on cgroup v1 hosts; this form works on both v1 and v2.
    cgroup: host
    volumes:
    - .:/workspace
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
    - /run
    - /run/lock
    command: /usr/sbin/init
  standby1-rhel9:
    privileged: true
    build:
      context: ../../docker
      dockerfile: Dockerfile.rhel9
      args:
        rhel9_image_tag: "${RHEL9_IMAGE_TAG:-9.7}"
    cap_add:
    - SYS_ADMIN
    # systemd needs a writable cgroup tree rooted at the host hierarchy. The
    # older `- /sys/fs/cgroup:ro` form used by the other test cases only works
    # on cgroup v1 hosts; this form works on both v1 and v2.
    cgroup: host
    volumes:
    - .:/workspace
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
    - /run
    - /run/lock
    command: /usr/sbin/init
  standby2-rhel9:
    privileged: true
    build:
      context: ../../docker
      dockerfile: Dockerfile.rhel9
      args:
        rhel9_image_tag: "${RHEL9_IMAGE_TAG:-9.7}"
    cap_add:
    - SYS_ADMIN
    # systemd needs a writable cgroup tree rooted at the host hierarchy. The
    # older `- /sys/fs/cgroup:ro` form used by the other test cases only works
    # on cgroup v1 hosts; this form works on both v1 and v2.
    cgroup: host
    volumes:
    - .:/workspace
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
    - /run
    - /run/lock
    command: /usr/sbin/init
  standby3-rhel9:
    privileged: true
    build:
      context: ../../docker
      dockerfile: Dockerfile.rhel9
      args:
        rhel9_image_tag: "${RHEL9_IMAGE_TAG:-9.7}"
    cap_add:
    - SYS_ADMIN
    # systemd needs a writable cgroup tree rooted at the host hierarchy. The
    # older `- /sys/fs/cgroup:ro` form used by the other test cases only works
    # on cgroup v1 hosts; this form works on both v1 and v2.
    cgroup: host
    volumes:
    - .:/workspace
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
    - /run
    - /run/lock
    command: /usr/sbin/init
