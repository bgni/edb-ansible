---
- name: Disable builtin postgresql module on EL8
  ansible.builtin.shell: >
    dnf -qy module disable postgresql
  args:
    executable: /bin/bash
  register: disable_builtin_postgres
  changed_when: disable_builtin_postgres.rc == 0
  # A base image that ships no postgresql module stream -- UBI, for one --
  # reports "missing groups or modules". There is nothing to disable in that
  # case, so it is a success, not a failure. Without this the task prints a
  # red fatal on every RHEL run that ignore_errors then swallows, which
  # trains operators to scroll past genuine fatals.
  failed_when:
    - disable_builtin_postgres.rc != 0
    - "'missing groups or modules' not in disable_builtin_postgres.stderr"
  ignore_errors: true
  become: true
  when:
    - ansible_distribution_major_version == '8'
    - ansible_os_family == 'RedHat'

- name: Install pgpoolII package
  ansible.builtin.package:
    name: "{{ pgpool2_package_name }}"
    state: present
  become: true

- name: Install openssl package
  ansible.builtin.package:
    name: "openssl"
    state: present
  when:
    - pgpool2_ssl
  become: true

- name: Install pgpool-II-pcp package on RedHat
  ansible.builtin.package:
    name: "{{ pgpool2_pcp_package_name }}"
    state: present
  when:
    - ansible_os_family == 'RedHat'
    - pg_type == 'PG'
  become: true

- name: Install dependent packages on Debian
  ansible.builtin.package:
    name:
      - libpgpool2
      - postgresql-client-common
    state: present
  when:
    - ansible_os_family == 'Debian'
    - pg_type == 'PG'
  become: true
