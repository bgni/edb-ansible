version: '3'

# Production-shaped topology from the source reviews: four PostgreSQL nodes
# (one primary, three standbys) plus a repmgr witness, a pgBackRest repository
# host and an HAProxy client gate.
#
# Service names must be exactly "<inventory_name>-<os>". tests/scripts/
# build-inventory.py splits on '-' to derive the inventory variable names, so
# a name with a second dash breaks inventory generation.

x-rhel9-node: &rhel9-node
  privileged: true
  build:
    context: ../../docker
    dockerfile: Dockerfile.rhel9
    args:
      rhel9_image_tag: "${RHEL9_IMAGE_TAG:-9.7}"
      RHEL_BASE_IMAGE: "${RHEL_BASE_IMAGE:-registry.access.redhat.com/ubi9/ubi-init:${RHEL9_IMAGE_TAG:-9.7}}"
      YUM_BASEURL: "${YUM_BASEURL:-}"
      YUM_GPGCHECK: "${YUM_GPGCHECK:-1}"
  cap_add:
    - SYS_ADMIN
  # systemd needs a writable cgroup tree rooted at the host hierarchy. The
  # `- /sys/fs/cgroup:ro` form used by the older cases only works on cgroup v1
  # hosts; this form works on both v1 and v2.
  cgroup: host
  volumes:
    - .:/workspace
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
  tmpfs:
    - /run
    - /run/lock
  command: /usr/sbin/init

services:
  ansible-tester:
    build:
      context: ../../docker
      dockerfile: Dockerfile.ansible-tester
      args:
        ansible_core_version: "${ANSIBLE_CORE_VERSION}"
        TESTER_BASE_IMAGE: "${TESTER_BASE_IMAGE:-debian:11-slim}"
        APT_MIRROR: "${APT_MIRROR:-}"
        APT_SECURITY_MIRROR: "${APT_SECURITY_MIRROR:-}"
        PIP_INDEX: "${PIP_INDEX_URL:-}"
        PIP_TRUSTED: "${PIP_TRUSTED_HOST:-}"
        GALAXY_SERVER: "${ANSIBLE_GALAXY_SERVER:-}"
    environment:
    - EDB_REPO_USERNAME="${EDB_REPO_USERNAME:- }"
    - EDB_REPO_PASSWORD="${EDB_REPO_PASSWORD:- }"
    - EDB_REPO_TOKEN="${EDB_REPO_TOKEN:- }"
    - EDB_ENABLE_REPO=${EDB_ENABLE_REPO:-true}
    - EDB_PG_TYPE
    - EDB_PG_VERSION
    - CASE_NAME=prod_topology
    - EDB_OS
    - ANSIBLE_CORE_VERSION="${ANSIBLE_CORE_VERSION:-2.15}"
    volumes:
    - ../../..:/workspace
    command: "/workspace/tests/docker/exec-tests.sh"

  primary1-rhel9:
    <<: *rhel9-node
    hostname: primary1
  standby1-rhel9:
    <<: *rhel9-node
    hostname: standby1
  standby2-rhel9:
    <<: *rhel9-node
    hostname: standby2
  standby3-rhel9:
    <<: *rhel9-node
    hostname: standby3
  witness1-rhel9:
    <<: *rhel9-node
    hostname: witness1
  pgbackrest1-rhel9:
    <<: *rhel9-node
    hostname: pgbackrest1
  haproxy1-rhel9:
    <<: *rhel9-node
    hostname: haproxy1
