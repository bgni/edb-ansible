---
# Renders the Ansible-managed identity maps into their own file and includes
# that file from the main pg_ident.conf.
#
# Writing a separate file rather than editing pg_ident.conf keeps one owner per
# file: this role owns every line of pg_ident_ansible.conf and rewrites it
# wholesale, while pg_ident.conf keeps whatever the distribution or an operator
# put there and only gains a single include line. PostgreSQL 15 and later
# support `include`/`include_if_exists` in pg_ident.conf.
- name: Find the ident file location
  community.postgresql.postgresql_query:
    login_user: "{{ pg_owner }}"
    port: "{{ pg_port }}"
    login_unix_socket: "{{ pg_unix_socket_directories[0] }}"
    query: "show ident_file;"
    db: "{{ pg_database }}"
  when: pg_ident_maps|length > 0
  become: true
  become_user: "{{ pg_owner }}"
  no_log: "{{ disable_logging }}"
  register: ident_info

- name: Set the ident file facts
  ansible.builtin.set_fact:
    _pg_ident_file: "{{ ident_info.query_result[0].ident_file }}"
    _pg_ident_managed_file: "{{ ident_info.query_result[0].ident_file | dirname }}/{{ pg_ident_managed_filename }}"
  when: pg_ident_maps|length > 0

- name: Create the Ansible managed ident map file
  ansible.builtin.template:
    src: pg_ident_ansible.conf.j2
    dest: "{{ _pg_ident_managed_file }}"
    owner: "{{ pg_owner }}"
    group: "{{ pg_group }}"
    mode: "0600"
  become: true
  when: pg_ident_maps|length > 0
  notify:
    - Reload the pg service

# The include is relative, which PostgreSQL resolves against the directory
# holding pg_ident.conf. include_if_exists rather than include so that removing
# the managed file does not stop Postgres from starting.
#
# The file name must NOT be quoted. postgresql.conf and pg_ident.conf differ
# here: postgresql.conf requires `include 'file'`, while pg_ident.conf and
# pg_hba.conf take the name literally and keep the quotes as part of it. With
# quotes, PostgreSQL looks for a file called "'pg_ident_ansible.conf'" inside
# the data directory, does not find it, and -- because include_if_exists
# ignores a missing file -- silently loads no mappings at all:
#
#   could not open file ".../data/'.../pg_ident_ansible.conf'"
#
# Everything then looks correctly configured while certificate authentication
# fails with "connection requires a valid client certificate".
- name: Include the Ansible managed ident map file from pg_ident.conf
  ansible.builtin.lineinfile:
    path: "{{ _pg_ident_file }}"
    line: "include_if_exists {{ pg_ident_managed_filename }}"
    regexp: "^\\s*include_if_exists\\s+'?{{ pg_ident_managed_filename }}'?\\s*$"
    owner: "{{ pg_owner }}"
    group: "{{ pg_group }}"
    mode: "0600"
    state: present
  become: true
  when: pg_ident_maps|length > 0
  notify:
    - Reload the pg service

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
