---
- name: Set synchronous_standby_names on {{ synchronous_node.inventory_hostname }}
  ansible.builtin.include_role:
    name: manage_dbserver
    tasks_from: manage_postgres_params
    apply:
      delegate_to: "{{ synchronous_node.inventory_hostname }}"
  vars:
    pg_postgres_conf_params:
      - name: synchronous_standby_names
        value: "{{ _effective_synchronous_standby_names | trim }}"

- name: Read synchronous_standby_names on {{ synchronous_node.inventory_hostname }}
  community.postgresql.postgresql_query:
    query: "SHOW synchronous_standby_names"
    port: "{{ pg_port }}"
    db: "{{ pg_database }}"
    login_user: "{{ pg_owner }}"
    login_unix_socket: "{{ pg_unix_socket_directories[0] }}"
  become: true
  become_user: "{{ pg_owner }}"
  delegate_to: "{{ synchronous_node.inventory_hostname }}"
  register: _synchronous_standby_setting

- name: Verify synchronous policy on {{ synchronous_node.inventory_hostname }}
  ansible.builtin.assert:
    that:
      - >-
        _synchronous_standby_setting.query_result[0].synchronous_standby_names ==
        _effective_synchronous_standby_names | trim
    fail_msg: >-
      {{ synchronous_node.inventory_hostname }} has synchronous_standby_names={{
      _synchronous_standby_setting.query_result[0].synchronous_standby_names }},
      expected={{ _effective_synchronous_standby_names | trim }}
