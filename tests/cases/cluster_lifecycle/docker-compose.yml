# Ephemeral nodes for the cluster lifecycle test.
#
# The Ansible runner mounts the external playbook checkout read-only at
# /playbook. The database nodes do not: they get only their own case directory,
# so nothing under test leaks onto the machines being configured.

x-rhel9-node: &rhel9-node
  privileged: true
  build:
    context: ../../docker
    dockerfile: Dockerfile.rhel9
    args:
      rhel9_image_tag: "${RHEL9_IMAGE_TAG:-9.7}"
      RHEL_BASE_IMAGE: "${RHEL_BASE_IMAGE:-registry.access.redhat.com/ubi9/ubi-init:${RHEL9_IMAGE_TAG:-9.7}}"
      YUM_BASEURL: "${YUM_BASEURL:-}"
      YUM_GPGCHECK: "${YUM_GPGCHECK:-1}"
  cap_add:
    - SYS_ADMIN
  cgroup: host
  volumes:
    # :z, the shared label: this directory is mounted into every node and the
    # runner. :Z would relabel it privately per container and the second one
    # to start would break the first.
    - .:/workspace:z
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
  tmpfs:
    - /run
    - /run/lock
  command: /usr/sbin/init

services:
  ansible-tester:
    build:
      context: ../../docker
      dockerfile: Dockerfile.ansible-tester
      args:
        ansible_core_version: "${ANSIBLE_CORE_VERSION}"
        TESTER_BASE_IMAGE: "${TESTER_BASE_IMAGE:-debian:11-slim}"
        APT_MIRROR: "${APT_MIRROR:-}"
        APT_SECURITY_MIRROR: "${APT_SECURITY_MIRROR:-}"
        PIP_INDEX: "${PIP_INDEX_URL:-}"
        PIP_TRUSTED: "${PIP_TRUSTED_HOST:-}"
        GALAXY_SERVER: "${ANSIBLE_GALAXY_SERVER:-}"
    environment:
    - EDB_PG_TYPE
    - EDB_PG_VERSION
    - EDB_OS
    - EDB_ENABLE_REPO=${EDB_ENABLE_REPO:-false}
    - ANSIBLE_CORE_VERSION="${ANSIBLE_CORE_VERSION:-2.15}"
    - CASE_NAME=cluster_lifecycle
    - EXTERNAL_PLAYBOOK=${EXTERNAL_PLAYBOOK:-cluster.yml}
    - LIFECYCLE_PHASES=${LIFECYCLE_PHASES:-provision,reconfigure,failover}
    volumes:
    - ../../..:/workspace:z
    # The playbook under test: read-only, and only here.
    - ${EXTERNAL_PLAYBOOK_ROOT:-../../..}:/playbook:ro
    command: "/workspace/tests/cases/cluster_lifecycle/run-phases.sh"

  postgres01-rhel9:
    <<: *rhel9-node
    hostname: postgres01
  postgres02-rhel9:
    <<: *rhel9-node
    hostname: postgres02
  postgres03-rhel9:
    <<: *rhel9-node
    hostname: postgres03
  postgres04-rhel9:
    <<: *rhel9-node
    hostname: postgres04
  witness1-rhel9:
    <<: *rhel9-node
    hostname: witness1
