---
- name: Open haproxy TCP port
  ansible.posix.firewalld:
    port: "{{ haproxy_port }}/tcp"
    permanent: true
    state: enabled
    immediate: true
  when:
    - ansible_facts.services['firewalld.service'] is defined
    - ansible_facts.services['firewalld.service'].state == 'running'
    - ansible_facts.services['firewalld.service'].status == 'enabled'
  become: true

- name: Open haproxy replica TCP port when haproxy_read_only_lb
  ansible.posix.firewalld:
    port: "{{ haproxy_replica_port }}/tcp"
    permanent: true
    state: enabled
    immediate: true
  when:
    - ansible_facts.services['firewalld.service'] is defined
    - ansible_facts.services['firewalld.service'].state == 'running'
    - ansible_facts.services['firewalld.service'].status == 'enabled'
    - haproxy_read_only_lb|bool
  become: true

- name: Set the os variable
  ansible.builtin.set_fact:
    os: "{{ ansible_distribution }}{{ ansible_distribution_major_version }}"
  when: os is not defined

- name: Create haproxy group
  ansible.builtin.group:
    name: "{{ haproxy_group }}"
    state: present
  become: true
  when: os not in [ 'Debian12' ]

- name: Create haproxy user
  ansible.builtin.user:
    name: "{{ haproxy_user }}"
    group: "{{ haproxy_group }}"
    create_home: true
    home: "{{ haproxy_user_home }}"
    state: present
  become: true
  when: os not in [ 'Debian12' ]

- name: Install haproxy
  ansible.builtin.package:
    name: "{{ haproxy_package }}"
    state: present
  become: true

- name: Include the haproxy_configure.yml
  ansible.builtin.include_tasks: haproxy_configure.yml

- name: Set haproxy_connect_any SELinux flag on and keep it persistent across reboots
  ansible.posix.seboolean:
    name: haproxy_connect_any
    state: true
    persistent: true
  # seboolean fails outright with "SELinux is disabled on this host" rather
  # than skipping, so the role could not complete anywhere SELinux is off --
  # a container, or a site that disables it by policy. There is also no boolean
  # to set in that case, so skipping is the correct behaviour rather than a
  # workaround.
  when: ansible_selinux.status | default('disabled') == 'enabled'

- name: Enable and start systemd service
  ansible.builtin.systemd:
    name: "{{ haproxy_service }}"
    daemon_reload: true
    state: restarted
    enabled: true
  become: true
