---
# Test matrix for the local runner (tests/test-runner.py).
#
# Scoped to the deployment this fork actually runs: PostgreSQL 17 on RHEL 9,
# with pgBackRest, repmgr and HAProxy. Everything else that used to be listed
# here -- pgBouncer, pgPool-II, EFM, Patroni, PEM, Barman, PGD, TDE, binary
# upgrade, and the DBT-2/3/7, HammerDB and touchstone benchmark harnesses --
# has been removed, along with every PostgreSQL major below 17 and every OS
# other than RHEL 9.
#
# Removed from automation, not from the tree. Those roles and their test cases
# still exist and can be run by hand when needed:
#
#   make -C tests/cases/setup_pgbouncer rocky8
#
# The previous full matrix is in git history if it is ever needed again.
#
# Between them, the three cases below exercise every role in the deployment:
# setup_repo, install_dbserver, init_dbserver, setup_replication, setup_repmgr,
# setup_pgbackrest, setup_pgbackrestserver, manage_dbserver,
# postgres-cluster-xinetd and setup_haproxy.
cases:
  # Core streaming replication: four nodes, quorum policy built by the role.
  setup_replication:
    pg_version:
    - 17
    pg_type:
    - PG
    os:
    - rhel9

  # Four node ANY 2 quorum, including the degraded-quorum write behaviour.
  setup_quorum_replication:
    pg_version:
    - 17
    pg_type:
    - PG
    os:
    - rhel9

  # Full stack: primary, three standbys, repmgr witness, pgBackRest repository
  # host and HAProxy client gate. Heavier than the two above -- eight
  # containers -- so CI runs it on manual dispatch only.
  prod_topology:
    pg_version:
    - 17
    pg_type:
    - PG
    os:
    - rhel9
