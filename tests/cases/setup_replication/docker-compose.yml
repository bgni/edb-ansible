version: '3'

x-rhel9-node: &rhel9-node
  privileged: true
  build:
    context: ../../docker
    dockerfile: Dockerfile.rhel9
    args:
      RHEL_BASE_IMAGE: "${RHEL_BASE_IMAGE:-registry.access.redhat.com/ubi9/ubi-init:${RHEL9_IMAGE_TAG:-9.7}}"
      YUM_BASEURL: "${YUM_BASEURL:-}"
      YUM_GPGCHECK: "${YUM_GPGCHECK:-1}"
  cap_add:
    - SYS_ADMIN
  # systemd needs a writable cgroup tree rooted at the host hierarchy. The
  # older `- /sys/fs/cgroup:ro` form only works on cgroup v1 hosts; this form
  # works on both v1 and v2.
  cgroup: host
  volumes:
    - .:/workspace:Z
    - /sys/fs/cgroup:/sys/fs/cgroup:rw
  tmpfs:
    - /run
    - /run/lock
  command: /usr/sbin/init

services:
  ansible-tester:
    build:
      context: ../../docker
      dockerfile: Dockerfile.ansible-tester
      args:
        ansible_core_version: "${ANSIBLE_CORE_VERSION}"
        TESTER_BASE_IMAGE: "${TESTER_BASE_IMAGE:-debian:11-slim}"
        APT_MIRROR: "${APT_MIRROR:-}"
        APT_SECURITY_MIRROR: "${APT_SECURITY_MIRROR:-}"
        PIP_INDEX: "${PIP_INDEX_URL:-}"
        PIP_TRUSTED: "${PIP_TRUSTED_HOST:-}"
        GALAXY_SERVER: "${ANSIBLE_GALAXY_SERVER:-}"
    environment:
    - EDB_REPO_USERNAME="${EDB_REPO_USERNAME:- }"
    - EDB_REPO_PASSWORD="${EDB_REPO_PASSWORD:- }"
    - EDB_REPO_TOKEN="${EDB_REPO_TOKEN:- }"
    - EDB_ENABLE_REPO=${EDB_ENABLE_REPO:-true}
    - EDB_PG_TYPE
    - EDB_PG_VERSION
    - CASE_NAME=setup_replication
    - EDB_OS
    - ANSIBLE_CORE_VERSION="${ANSIBLE_CORE_VERSION:-2.13}"
    # Set by `run-case.sh --tests-only` to re-run pytest against a
    # cluster that is already deployed.
    - SKIP_PLAYBOOK=${SKIP_PLAYBOOK:-false}
    - PYTEST_ARGS=${PYTEST_ARGS:-}
    # Offline mode: skip the roles that need a package repository.
    - PREINSTALLED=${PREINSTALLED:-false}
    volumes:
    - ../../..:/workspace:Z
    command: "/workspace/tests/docker/exec-tests.sh"
  postgres01-rhel9:
    <<: *rhel9-node
    hostname: postgres01
  postgres02-rhel9:
    <<: *rhel9-node
    hostname: postgres02
  postgres03-rhel9:
    <<: *rhel9-node
    hostname: postgres03
  postgres04-rhel9:
    <<: *rhel9-node
    hostname: postgres04
  primary1-rocky8:
    privileged: true
    build:
      context: ../../docker
      dockerfile: Dockerfile.rocky8
    cap_add:
    - SYS_ADMIN
    volumes:
    - .:/workspace:Z
    - /sys/fs/cgroup/:/sys/fs/cgroup:ro
    command: /usr/sbin/init
  standby1-rocky8:
    privileged: true
    build:
      context: ../../docker
      dockerfile: Dockerfile.rocky8
    cap_add:
    - SYS_ADMIN
    volumes:
    - .:/workspace:Z
    - /sys/fs/cgroup/:/sys/fs/cgroup:ro
    command: /usr/sbin/init
  standby2-rocky8:
    privileged: true
